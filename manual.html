<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laplacian Curvature Lab — Programmer’s Manual</title>
<style>
:root{--ink:#1d1d1f;--muted:#5f6368;--paper:#ffffff;--wash:#f6f5f2;--rule:#dedcd6;--accent:#d4561c;--accent2:#f7a440;--link:#1f5fa8;--code:#fbfaf7;--codeink:#20242a;--in:#9a3f12;--out:#5f6368;--head:#2b2b2e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
code,pre,.mono{font-family:"Source Code Pro",Menlo,Consolas,"DejaVu Sans Mono",monospace}
header.top{position:sticky;top:0;z-index:10;background:var(--head);color:#fff;display:flex;align-items:center;gap:18px;padding:0 22px;height:52px;box-shadow:0 1px 0 rgba(0,0,0,.2)}
header.top .logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;letter-spacing:.2px;white-space:nowrap}
header.top .logo .mark{width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font:700 13px/1 Georgia,serif;color:#fff}
header.top .logo small{font-weight:400;opacity:.7;margin-left:4px}
header.top nav{display:flex;gap:16px;font-size:14px}
header.top nav a{color:#e9e6df}
header.top .search{margin-left:auto;position:relative}
header.top input{width:280px;border:0;border-radius:4px;padding:7px 10px 7px 30px;font:14px inherit;background:#fff;color:var(--ink)}
header.top .search:before{content:"⌕";position:absolute;left:10px;top:4px;color:#777;font-size:17px}
#results{position:absolute;right:0;top:38px;width:420px;max-height:60vh;overflow:auto;background:#fff;color:var(--ink);border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:none}
#results a{display:block;padding:7px 12px;border-bottom:1px solid #f0eee9;color:var(--ink)}#results a:hover,#results a.on{background:#fdf1e8;text-decoration:none}
#results b{font-family:"Source Code Pro",Menlo,monospace;color:var(--accent)}#results span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs{background:var(--wash);border-bottom:1px solid var(--rule);font-size:13px;color:var(--muted);padding:7px 22px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs .sep{opacity:.5}
.crumbs .right{margin-left:auto;display:flex;gap:14px}
main{max-width:1020px;margin:0 auto;padding:22px 28px 60px}
.reftype{display:flex;align-items:center;gap:12px;margin:6px 0 2px}
.tag{font:600 11px/1 "Source Sans 3",Arial,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:4px 7px;border-radius:3px}
.tag.snip{color:#7a4bb0;border-color:#7a4bb0}.tag.api{color:#1f7a58;border-color:#1f7a58}.tag.val{color:#1f5fa8;border-color:#1f5fa8}
h1.sym{font:600 38px/1.15 "Source Code Pro",Menlo,monospace;margin:8px 0 14px;color:#111;word-break:break-all}
.usage{border-top:2px solid var(--accent);border-bottom:1px solid var(--rule);margin:0 0 18px}
.usage .row{display:grid;grid-template-columns:minmax(220px,auto) 1fr;gap:22px;padding:13px 4px;border-bottom:1px solid #eeece7}
.usage .row:last-child{border-bottom:0}
.usage .tpl{font-family:"Source Code Pro",Menlo,monospace;font-size:15px;white-space:nowrap}
.usage .tpl b{font-weight:700}.usage .tpl i{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:16px;color:#333}
.usage .txt{color:#333}
details.sec{border-top:1px solid var(--rule);margin:0}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 4px;font:600 19px/1.3 "Source Sans 3",Arial,sans-serif;color:#222;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:before{content:"";width:0;height:0;border-left:7px solid var(--accent);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
details.sec[open]>summary:before{transform:rotate(90deg)}
details.sec>summary .n{font-weight:400;color:var(--muted);font-size:15px}
.detail-list{margin:0 0 16px 22px;padding:0}
.detail-list li{margin:7px 0;padding-left:6px}
details.sub{margin:0 0 6px 18px}
details.sub>summary{list-style:none;cursor:pointer;padding:8px 0;font:600 16px "Source Sans 3",Arial,sans-serif;color:#333;display:flex;gap:9px;align-items:center}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary:before{content:"";border-left:6px solid #999;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details.sub[open]>summary:before{transform:rotate(90deg)}
details.sub>summary .n{font-weight:400;color:var(--muted);font-size:14px}
.cell{display:grid;grid-template-columns:76px 1fr;gap:0 10px;margin:6px 0 14px 4px}
.cell .lab{font:italic 12.5px/1.9 Georgia,serif;color:var(--in);text-align:right;padding-top:6px;white-space:nowrap}
.cell .lab.o{color:var(--out)}
.cell pre{margin:0;padding:8px 12px;background:var(--code);border:1px solid #ecebe6;border-radius:4px;font-size:13.6px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--codeink);position:relative}
.cell pre.in{border-left:3px solid var(--accent2)}
.cell pre.out{background:#fff;border-color:#f0efea}
.cell .img{padding:6px 0}.cell .img img{max-width:100%;border:1px solid #f0efea;border-radius:4px;background:#fff}
.copy{position:absolute;right:6px;top:5px;font:11px "Source Sans 3",Arial;background:#fff;border:1px solid var(--rule);color:var(--muted);border-radius:3px;padding:1px 7px;cursor:pointer;opacity:0;transition:opacity .15s}
pre:hover .copy{opacity:1}
pre .fn{color:var(--link);font-weight:600}pre .str{color:#1d7a4a}pre .cmt{color:#8a8a8a;font-style:italic}pre .num{color:#7a3fb0}
.src pre{margin:4px 0 16px;padding:12px 14px;background:#2a2b2f;color:#eee9df;border-radius:5px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.src pre .fn{color:#ffb36b}.src pre .str{color:#a8d98a}.src pre .cmt{color:#9a9a9a}.src pre .num{color:#d4b3ff}
.src .note{font-size:13px;color:var(--muted);margin:0 0 4px}
.see{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 18px 4px;font-family:"Source Code Pro",Menlo,monospace;font-size:14px}
.see a:after{content:"";}
.hist{margin:4px 0 18px 4px;color:#444}
.guides{margin:4px 0 18px 4px}
footer{border-top:1px solid var(--rule);margin-top:34px;padding-top:14px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
/* home & guide */
.hero{background:linear-gradient(120deg,#2b2b2e 0%,#3a3530 60%,#5a3a22 100%);color:#fff;border-radius:8px;padding:30px 32px;margin:0 0 26px}
.hero h1{margin:0 0 6px;font:600 30px/1.2 "Source Sans 3",Arial,sans-serif}
.hero p{margin:0;opacity:.85;max-width:720px}
.hero .meta{margin-top:14px;font-size:13px;opacity:.75}
.hero .meta a{color:#ffd2a8}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.tile{border:1px solid var(--rule);border-radius:7px;padding:16px 18px;background:#fff;transition:box-shadow .15s,border-color .15s;display:block;color:var(--ink)}
.tile:hover{border-color:var(--accent2);box-shadow:0 4px 16px rgba(212,86,28,.12);text-decoration:none}
.tile h3{margin:0 0 6px;font-size:17px;color:#222}
.tile p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.tile .fns{font:12.5px/1.6 "Source Code Pro",Menlo,monospace;color:var(--link)}
.gtitle{font:600 32px/1.2 "Source Sans 3",Arial,sans-serif;margin:8px 0 8px}
.gdesc{color:#333;max-width:820px;margin:0 0 18px}
.glist{border-top:2px solid var(--accent)}
.glist .r{display:grid;grid-template-columns:230px 1fr;gap:18px;padding:9px 4px;border-bottom:1px solid #eeece7}
.glist .r a{font-family:"Source Code Pro",Menlo,monospace;font-weight:600}
.glist .r span{color:#444;font-size:14px}
.idx h2{font:600 20px "Source Sans 3",Arial;border-bottom:1px solid var(--rule);margin:22px 0 8px;padding-bottom:4px;color:var(--accent)}
.idx .cols{columns:3 240px;column-gap:28px}
.idx .cols a{display:block;font-family:"Source Code Pro",Menlo,monospace;font-size:14px;padding:2px 0;break-inside:avoid}
.idx .cols a small{font-family:"Source Sans 3",Arial;color:var(--muted);font-size:12px;margin-left:6px}
.stats{display:flex;gap:26px;margin:0 0 22px;color:var(--muted);font-size:13.5px}
.stats b{display:block;font-size:24px;color:var(--ink)}
/* CCN: always-visible scrollbars (macOS/iPadOS hide overlay scrollbars) + tab-strip arrows */::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:rgba(127,127,127,.12);border-radius:8px}::-webkit-scrollbar-thumb{background:rgba(127,127,127,.55);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:rgba(212,86,28,.75);background-clip:padding-box}*{scrollbar-width:auto;scrollbar-color:rgba(127,127,127,.6) rgba(127,127,127,.12)}.hs-wrap{position:relative;display:flex;align-items:stretch;min-width:0}.hs-wrap>.hs-strip{flex:1 1 auto;min-width:0}.hs-btn{flex:none;width:30px;border:1px solid rgba(127,127,127,.35);background:inherit;color:inherit;font:600 18px/1 system-ui,sans-serif;cursor:pointer;border-radius:6px;margin:2px 3px 10px;opacity:.85}.hs-btn:hover{opacity:1;border-color:#d4561c;color:#d4561c}.hs-btn[disabled]{opacity:.25;cursor:default}.hs-wrap:not(.hs-over)>.hs-btn{display:none}.hs-wrap:not(.hs-over){display:contents}
@media (max-width:720px){header.top input{width:150px}header.top nav{display:none}.usage .row,.glist .r{grid-template-columns:1fr;gap:4px}.cell{grid-template-columns:1fr}.cell .lab{text-align:left;padding:0}#results{width:300px}h1.sym{font-size:28px}}
@media print{header.top,.crumbs .right,.copy{display:none}details.sec,details.sub{display:block}}
</style>
</head>

, φ};\nchristoffel[gS2, 𝓍S2]", "out": "{{{0, 0}, {0, -(Cos[θ]*Sin[θ])}}, {{0, Cot[θ]}, {Cot[θ], 0}}}"}], "Scope": [{"in": "christoffel[{{1, 0}, {0, r^2}}, {r, ϑ}]", "out": "{{{0, 0}, {0, -r}}, {{0, r^(-1)}, {r^(-1), 0}}}"}], "Properties & Relations": [{"in": "With[{Γ = christoffel[gS2, 𝓍S2]}, Table[Γ[[i, j, k]] - Γ[[i, k, j]], {i, 2}, {j, 2}, {k, 2}]]", "out": "{{{0, 0}, {0, 0}}, {{0, 0}, {0, 0}}}"}]}, "see": ["hessian", "gaussCurvature", "laplaceBeltrami", "roughLaplacian1"], "source": "christoffel[g_, 𝓍_] := Module[{gi = Inverse[g], n = Length[𝓍]},\n  Table[1/2 Sum[gi[[i, l]] (D[g[[l, j]], 𝓍[[k]]] + D[g[[l, k]], 𝓍[[j]]] - D[g[[j, k]], 𝓍[[l]]]), {l, n}],\n   {i, n}, {j, n}, {k, n}] // Simplify];"}, "laplaceBeltrami": {"name": "laplaceBeltrami", "slug": "laplaceBeltrami", "guide": "riemannian", "defined": "Notebook §1", "kind": "Function", "usage": [["laplaceBeltrami[g, 𝓍][u]", "gives the Laplace–Beltrami operator Δu = (1/√det g) Σ ∂ᵢ(√det g gⁱʲ ∂ⱼu) of u for the metric g in coordinates 𝓍."]], "details": ["laplaceBeltrami[g, 𝓍] is an operator: apply it to an expression, or map it over a list.", "The sign convention is the analyst’s: Δ = div grad, so Δ ≤ 0 on a closed manifold.", "The result is not simplified; wrap it in Simplify when needed."], "examples": {"Basic Examples": [{"in": "gS2 = {{1, 0}, {0, Sin[θ]^2}}; 𝓍S2 = {θ, φ};\nSimplify[laplaceBeltrami[gS2, 𝓍S2][Cos[θ]]]", "out": "-2*Cos[θ]"}], "Scope": [{"in": "Simplify[laplaceBeltrami[{{1, 0}, {0, 1}}, {x, y}][x^2 y]]", "out": "2*y"}, {"in": "gS2 = {{1, 0}, {0, Sin[θ]^2}}; 𝓍S2 = {θ, φ};\nSimplify[laplaceBeltrami[gS2, 𝓍S2][θ]]", "out": "Cot[θ]"}], "Properties & Relations": [{"in": "Simplify[laplaceBeltrami[{{1, 0}, {0, 1}}, {x, y}][F[x, y]] == Laplacian[F[x, y], {x, y}]]", "out": "True"}]}, "see": ["gradNorm2", "hessian", "meanCurvatureVector", "Lap"], "source": "laplaceBeltrami[g_, 𝓍_][u_] := Module[{gi = Inverse[g], s = Sqrt[Det[g]], n = Length[𝓍]},\n  1/s Sum[D[s gi[[i, j]] D[u, 𝓍[[j]]], 𝓍[[i]]], {i, n}, {j, n}]];"}, "gradNorm2": {"name": "gradNorm2", "slug": "gradNorm2", "guide": "riemannian", "defined": "Notebook §1", "kind": "Function", "usage": [["gradNorm2[g, 𝓍][u]", "gives |∇u|² = Σ gⁱʲ ∂ᵢu ∂ⱼu for the metric g in coordinates 𝓍."]], "details": ["Used in the Bochner formula ½Δ|∇f|² = |Hess f|² + ⟨∇f, ∇Δf⟩ + Ric(∇f, ∇f)."], "examples": {"Basic Examples": [{"in": "gS2 = {{1, 0}, {0, Sin[θ]^2}}; 𝓍S2 = {θ, φ};\ngradNorm2[gS2, 𝓍S2][Sin[θ] Cos[φ]]", "out": "Cos[θ]^2*Cos[φ]^2 + Sin[φ]^2"}]}, "see": ["hessNorm2", "laplaceBeltrami", "g2"], "source": "gradNorm2[g_, 𝓍_][u_] := With[{gi = Inverse[g]}, Sum[gi[[i, j]] D[u, 𝓍[[i]]] D[u, 𝓍[[j]]], {i, Length[𝓍]}, {j, Length[𝓍]}]];"}, "hessian": {"name": "hessian", "slug": "hessian", "guide": "riemannian", "defined": "Notebook §1", "kind": "Function", "usage": [["hessian[g, 𝓍][u]", "gives the covariant Hessian ∇ᵢ∇ⱼu = ∂ᵢ∂ⱼu − Σ Γᵏᵢⱼ ∂ₖu as a matrix."]], "details": ["The trace with the inverse metric, Tr[g⁻¹·hessian], is the Laplace–Beltrami operator."], "examples": {"Basic Examples": [{"in": "gS2 = {{1, 0}, {0, Sin[θ]^2}}; 𝓍S2 = {θ, φ};\nSimplify[hessian[gS2, 𝓍S2][Cos[θ]]]", "out": "{{-Cos[θ], 0}, {0, -(Cos[θ]*Sin[θ]^2)}}"}], "Properties & Relations": [{"in": "gS2 = {{1, 0}, {0, Sin[θ]^2}}; 𝓍S2 = {θ, φ};\nSimplify[Tr[Inverse[gS2] . hessian[gS2, 𝓍S2][F[θ, φ]]] - laplaceBeltrami[gS2, 𝓍S2][F[θ, φ]]]", "out": "0"}]}, "see": ["christoffel", "hessNorm2", "laplaceBeltrami", "Hs"], "source": "hessian[g_, 𝓍_][u_] := With[{Γ = christoffel[g, 𝓍], n = Length[𝓍]},\n  Table[D[u, 𝓍[[i]], 𝓍[[j]]] - Sum[Γ[[k, i, j]] D[u, 𝓍[[k]]], {k, n}], {i, n}, {j, n}]];"}, "hessNorm2": {"name": "hessNorm2", "slug": "hessNorm2", "guide": "riemannian", "defined": "Notebook §1", "kind": "Function", "usage": [["hessNorm2[g, 𝓍][u]", "gives |Hess u|² = Tr[g⁻¹ H g⁻¹ H] with H the covariant Hessian of u."]], "details": ["The squared Hessian term of the Bochner formula."], "examples": {"Basic Examples": [{"in": "gS2 = {{1, 0}, {0, Sin[θ]^2}}; 𝓍S2 = {θ, φ};\nSimplify[hessNorm2[gS2, 𝓍S2][Cos[θ]]]", "out": "2*Cos[θ]^2"}]}, "see": ["hessian", "gradNorm2"], "source": "hessNorm2[g_, 𝓍_][u_] := With[{gi = Inverse[g], H = hessian[g, 𝓍][u]}, Tr[gi . H . gi . H]];"}, "gaussCurvature": {"name": "gaussCurvature", "slug": "gaussCurvature", "guide": "riemannian", "defined": "Notebook §1", "kind": "Function", "usage": [["gaussCurvature[g, 𝓍]", "gives the Gauss curvature of a two-dimensional metric g in coordinates 𝓍, from the Riemann tensor: K = R₁₂₁₂ / det g."]], "details": ["g must be 2×2. For embedded surfaces see surfaceCurvatures; for conformal metrics see Kconformal."], "examples": {"Basic Examples": [{"in": "gS2 = {{1, 0}, {0, Sin[θ]^2}}; 𝓍S2 = {θ, φ};\ngaussCurvature[gS2, 𝓍S2]", "out": "1"}], "Scope": [{"in": "gaussCurvature[{{1, 0}, {0, Sinh[r]^2}}, {r, φ}]", "out": "-1"}, {"in": "gaussCurvature[{{(2 + Cos[v])^2, 0}, {0, 1}}, {u, v}]", "out": "Cos[v]/(2 + Cos[v])"}], "Properties & Relations": [{"in": "Simplify[Kconformal[w[x, y]] - gaussCurvature[Exp[2 w[x, y]] IdentityMatrix[2], {x, y}]]", "out": "0"}]}, "see": ["Kconformal", "surfaceCurvatures", "christoffel"], "source": "gaussCurvature[g_, 𝓍_] := Module[{Γ = christoffel[g, 𝓍], R},\n  R[i_, j_, k_, l_] := D[Γ[[i, j, l]], 𝓍[[k]]] - D[Γ[[i, j, k]], 𝓍[[l]]] +\n     Sum[Γ[[i, k, m]] Γ[[m, j, l]] - Γ[[i, l, m]] Γ[[m, j, k]], {m, 2}];\n  Simplify[Sum[g[[1, i]] R[i, 2, 1, 2], {i, 2}]/Det[g]]];"}, "roughLaplacian1": {"name": "roughLaplacian1", "slug": "roughLaplacian1", "guide": "riemannian", "defined": "Notebook §10.1", "kind": "Function", "usage": [["roughLaplacian1[g, 𝓍][ω]", "gives the rough (connection) Laplacian ∇*∇ω = −gʲᵏ ∇ₖ∇ⱼ ω of the 1-form ω, given as its list of components."]], "details": ["Second covariant derivatives are built from christoffel.", "With the Hodge Laplacian it verifies the Weitzenböck identity Δ_Hodge = ∇*∇ + Ric."], "examples": {"Basic Examples": [{"in": "gS2 = {{1, 0}, {0, Sin[θ]^2}}; 𝓍S2 = {θ, φ};\nSimplify[roughLaplacian1[gS2, 𝓍S2][{0, Sin[θ]^2}]]", "out": "{0, Sin[θ]^2}"}], "Properties & Relations": [{"in": "gS2 = {{1, 0}, {0, Sin[θ]^2}}; 𝓍S2 = {θ, φ};\nWith[{ΔS2 = laplaceBeltrami[gS2, 𝓍S2]}, Simplify[dS2[-ΔS2[F[θ, φ]]] + star1[dS2[-ΔS2[H[θ, φ]]]] - (roughLaplacian1[gS2, 𝓍S2][dS2[F[θ, φ]] + star1[dS2[H[θ, φ]]]] + dS2[F[θ, φ]] + star1[dS2[H[θ, φ]]])]]", "out": "{0, 0}"}]}, "see": ["dS2", "star1", "christoffel", "rough"], "source": "roughLaplacian1[g_, 𝓍_][ω_] := Module[{Γ = christoffel[g, 𝓍], gi = Inverse[g], n = Length[𝓍], T, TT},\n  T = Table[D[ω[[i]], 𝓍[[j]]] - Sum[Γ[[k, i, j]] ω[[k]], {k, n}], {i, n}, {j, n}];\n  TT = Table[D[T[[i, j]], 𝓍[[k]]] - Sum[Γ[[m, k, i]] T[[m, j]] + Γ[[m, k, j]] T[[i, m]], {m, n}], {i, n}, {j, n}, {k, n}];\n  Table[-Sum[gi[[j, k]] TT[[i, j, k]], {j, n}, {k, n}], {i, n}]];"}, "dS2": {"name": "dS2", "slug": "dS2", "guide": "riemannian", "defined": "Notebook §10.1", "kind": "Function", "usage": [["dS2[h]", "gives the differential dh of a function h(θ, φ) on S² as its covector {∂θh, ∂φh}."]], "details": ["Defined for the coordinates θ, φ of the unit sphere."], "examples": {"Basic Examples": [{"in": "dS2[Sin[θ] Cos[φ]]", "out": "{Cos[θ]*Cos[φ], -(Sin[θ]*Sin[φ])}"}]}, "see": ["star1", "roughLaplacian1"], "source": "dS2[h_] := {D[h, θ], D[h, φ]};"}, "star1": {"name": "star1", "slug": "star1", "guide": "riemannian", "defined": "Notebook §10.1", "kind": "Function", "usage": [["star1[{a, b}]", "gives the Hodge star of the 1-form a dθ + b dφ on the unit sphere: {−b/sin θ, a sin θ}."]], "details": ["Every 1-form on S² is df + ⋆dh, because S² has no harmonic 1-forms.", "Applying star1 twice gives −1, as for any 1-form in two dimensions."], "examples": {"Basic Examples": [{"in": "star1[{1, 0}]", "out": "{0, Sin[θ]}"}], "Properties & Relations": [{"in": "Simplify[star1[star1[{a, b}]]]", "out": "{-a, -b}"}]}, "see": ["dS2", "roughLaplacian1", "star"], "source": "star1[{a_, b_}] := {-b/Sin[θ], a Sin[θ]};"}, "surfaceCurvatures": {"name": "surfaceCurvatures", "slug": "surfaceCurvatures", "guide": "surfaces", "defined": "Notebook §1.1", "kind": "Function", "usage": [["surfaceCurvatures[pos, 𝓍]", "gives an Association with the Gauss curvature \"K\", mean curvature \"H\" and area element \"dA\" of the surface pos(u, v) ⊂ ℝ³ in parameters 𝓍."]], "details": ["Uses the first fundamental form E, F, G and the second L, M, N: K = (LN − M²)/(EG − F²), H = (EN − 2FM + GL)/(2(EG − F²)).", "The sign of H follows the normal Xᵤ × Xᵥ; the sign of K does not depend on it."], "examples": {"Basic Examples": [{"in": "torusPos = {(2 + Cos[v]) Cos[u], (2 + Cos[v]) Sin[u], Sin[v]};\nsurfaceCurvatures[torusPos, {u, v}]", "out": "<|\"K\" -> Cos[v]/(2 + Cos[v]), \"H\" -> -((1 + Cos[v])/Sqrt[(2 + Cos[v])^2]), \"dA\" -> Sqrt[(2 + Cos[v])^2]|>"}], "Scope": [{"in": "surfaceCurvatures[{Sech[v] Cos[u], Sech[v] Sin[u], v - Tanh[v]}, {u, v}][\"K\"]", "out": "-1"}, {"in": "surfaceCurvatures[{u, v, u^2 - v^2}, {u, v}][\"K\"]", "out": "-4/(1 + 4*u^2 + 4*v^2)^2"}], "Properties & Relations": [{"in": "torusPos = {(2 + Cos[v]) Cos[u], (2 + Cos[v]) Sin[u], Sin[v]};\nWith[{t = surfaceCurvatures[torusPos, {u, v}]}, Integrate[Simplify[t[\"K\"] t[\"dA\"], 0 < v < 2 π], {u, 0, 2 π}, {v, 0, 2 π}]]", "out": "0"}]}, "see": ["meanCurvatureVector", "gaussCurvature", "curvatureSurface"], "source": "surfaceCurvatures[pos_, 𝓍_] := Module[{Xu, Xv, nn, E1, F1, G1, L1, M1, N1},\n  Xu = D[pos, 𝓍[[1]]]; Xv = D[pos, 𝓍[[2]]];\n  nn = Cross[Xu, Xv]/Sqrt[Cross[Xu, Xv] . Cross[Xu, Xv]];\n  {E1, F1, G1} = {Xu . Xu, Xu . Xv, Xv . Xv};\n  {L1, M1, N1} = {D[pos, 𝓍[[1]], 𝓍[[1]]] . nn, D[pos, 𝓍[[1]], 𝓍[[2]]] . nn, D[pos, 𝓍[[2]], 𝓍[[2]]] . nn};\n  <|\"K\" -> Simplify[(L1 N1 - M1^2)/(E1 G1 - F1^2)],\n    \"H\" -> Simplify[(E1 N1 - 2 F1 M1 + G1 L1)/(2 (E1 G1 - F1^2))],\n    \"dA\" -> Simplify[Sqrt[E1 G1 - F1^2]]|>];"}, "meanCurvatureVector": {"name": "meanCurvatureVector", "slug": "meanCurvatureVector", "guide": "surfaces", "defined": "Notebook §3", "kind": "Function", "usage": [["meanCurvatureVector[pos, 𝓍]", "gives the mean curvature \"H\" from ΔX = −2H n and the \"tangential part\" of ΔX, which is zero."], ["meanCurvatureVector[pos, 𝓍, assum]", "simplifies under the extra assumptions assum."]], "details": ["ΔX is the Laplace–Beltrami operator of the induced metric applied to each coordinate of pos.", "A surface is minimal exactly when its coordinate functions are harmonic."], "examples": {"Basic Examples": [{"in": "meanCurvatureVector[{Cosh[v] Cos[u], Cosh[v] Sin[u], v}, {u, v}]", "out": "<|\"H\" -> 0, \"tangential part\" -> {0, 0}|>"}], "Scope": [{"in": "meanCurvatureVector[3 {Sin[θ] Cos[φ], Sin[θ] Sin[φ], Cos[θ]}, {θ, φ}, 0 < θ < π]", "out": "<|\"H\" -> 1/3, \"tangential part\" -> {0, 0}|>"}, {"in": "meanCurvatureVector[{(2 + Cos[v]) Cos[u], (2 + Cos[v]) Sin[u], Sin[v]}, {u, v}]", "out": "<|\"H\" -> (2*Cos[v/2]^2)/(2 + Cos[v]), \"tangential part\" -> {0, 0}|>"}]}, "see": ["surfaceCurvatures", "laplaceBeltrami"], "source": "meanCurvatureVector[pos_, 𝓍_, assum_ : True] := Module[{g, n, ΔX},\n  g = Simplify[Table[D[pos, 𝓍[[i]]] . D[pos, 𝓍[[j]]], {i, 2}, {j, 2}]];\n  ΔX = Simplify[laplaceBeltrami[g, 𝓍] /@ pos];\n  n = Simplify[Normalize[Cross[D[pos, 𝓍[[1]]], D[pos, 𝓍[[2]]]]], 𝓍 ∈ Reals && assum];\n  <|\"H\" -> Simplify[-ΔX . n/2, 𝓍 ∈ Reals && assum],\n    \"tangential part\" -> Simplify[{ΔX . D[pos, 𝓍[[1]]], ΔX . D[pos, 𝓍[[2]]]}]|>];"}, "Kconformal": {"name": "Kconformal", "slug": "Kconformal", "guide": "surfaces", "defined": "Notebook §2", "kind": "Function", "usage": [["Kconformal[u]", "gives the Gauss curvature K = −e^{−2u} Δ₀u of the conformal metric e^{2u}(dx² + dy²), with u an expression in x and y."]], "details": ["Δ₀ is the flat Laplacian in x, y. For constant K this is Liouville’s equation.", "The same identity makes 2-D Ricci flow the heat equation ∂u/∂t = e^{−2u}Δ₀u = −K."], "examples": {"Basic Examples": [{"in": "Kconformal[Log[2/(1 + x^2 + y^2)]]", "out": "1"}], "Scope": [{"in": "Kconformal[Log[1/y]]", "out": "-1"}, {"in": "Kconformal[Log[2/(1 - x^2 - y^2)]]", "out": "-1"}]}, "see": ["gaussCurvature", "Kt"], "source": "Kconformal[u_] := Simplify[-Exp[-2 u] (D[u, {x, 2}] + D[u, {y, 2}])];"}, "curvatureSurface": {"name": "curvatureSurface", "slug": "curvatureSurface", "guide": "surfaces", "defined": "Notebook §1.1", "kind": "Function", "usage": [["curvatureSurface[pos, {u, u0, u1}, {v, v0, v1}, κ, s, label]", "plots the surface pos coloured by the curvature expression κ on the scale ±s, titled label."], ["curvatureSurface[…, opts]", "passes options opts to ParametricPlot3D."]], "details": ["Colours come from κColour: blue negative, near-white zero, CCN orange positive.", "κ is an expression in the same parameters u, v as pos."], "examples": {"Basic Examples": [{"in": "torusPos = {(2 + Cos[v]) Cos[u], (2 + Cos[v]) Sin[u], Sin[v]};\ncurvatureSurface[torusPos, {u, 0, 2 π}, {v, 0, 2 π}, Cos[v]/(2 + Cos[v]), 1, \"Torus: K\"]", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAWgAAAEmCAIAAADA1Z2eAAAAxmVYSWZJSSoACAAAAAgAAAEEAAEAAABoAQAAAQEEAAEAAAAmAQAAGgEFAAEAAABuAAAAGwEFAAEAAAB2AAAAKAEDAAEAAAACAAAAMQECADMAAAB+AAAAMgECABMAAACyAAAAKogIAAEAAAD6/wAAAAAAAEgAAAABAAAASAAAAAEAAABDcmVhdGVkIHdpdGggdGhlIFdvbGZyYW0gTGFuZ3VhZ2UgOiB3d3cud29sZnJhbS5jb20AMjAyNjoxMToyMyAwNzo0Njo1NACywFj7AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAPHRFWHRTb2Z0d2FyZQBDcmVhdGVkIHdpdGggdGhlIFdvbGZyYW0gTGFuZ3VhZ2UgOiB3d3cud29sZnJhbS5jb21coqaFAAAAIXRFWHRDcmVhdGlvbiBUaW1lADIwMjY6MTE6MjMgMDc6NDY6NTSqGo6eAAAgAElEQVR4Xuy9CbAs2VnfmbXv693e1v3U3VpBK8NmbAaEjdg0EIEFzGAGhGNiMOOJYJtgPDEB4ZkwMWN7WIxjzBgTSDIYswkYSSMhoQWJTRJGaklIGHqRut9addfa96r5f8s5ebKq7n1177uv33v3ZnV2vVN5s7KqTmb+8v8t5zuR2XTmhY+wB8IeCHvgOD0QPc7G4bZhD4Q9EPYA9UAkVBxn70T41Kc+9eSTT+J3PUn/Pvnm73sz2q95zWte+9rX3rsf+7a3vW3mzeSzfvhHfjgSifzsz/zsvfu4cM/3twdCxXF/+/+efDoY8X38eO1riBTaNtQgljBW3AfWvPVtbz3i2+Cvi+9aun1IjXtyUB+wnYbgeMAOyL38OrjyX/91r4ceedu/f9uP/OiPyEdhDcQCVtL6t73NxQf+RLLlySexccSLYAP569xm7lcOqXEvD+ADtO8QHA/QwbjXXwWXvagPGBEwJSwjYGLIyqVfALywEkYsEZg8r3vt6xY3BlBCC+VeH8QHZP8hOB6QA/FCfA0gQK58PF7z6tfYj1xKAftXYAJEeMtb34JF3wuQvMZ/u7sl5MknP/nJF+LHhJ9xX3sgBMd97f4H48OXUsB "}, "atPole": {"name": "atPole", "slug": "atPole", "guide": "means", "defined": "Notebook §4", "kind": "Function", "usage": [["atPole[h]", "evaluates h at the north pole x = 0, y = 0, z = 1."]], "details": [], "examples": {"Basic Examples": [{"in": "atPole[Exp[x] (1 + z)^2 + y z^3]", "out": "4"}]}, "see": ["ΔS2amb", "F0"], "source": "atPole[h_] := h /. {x -> 0, y -> 0, z -> 1};"}, "exactMean": {"name": "exactMean", "slug": "exactMean", "guide": "means", "defined": "Notebook §4.1", "kind": "Function", "usage": [["exactMean[r]", "gives the mean of F0 over the geodesic circle of colatitude r about the north pole, by numerical integration at 40-digit precision."]], "details": ["Used to measure the error of flat4, curved4 and curved6; their errors fall like r⁴, r⁶ and r⁸."], "examples": {"Basic Examples": [{"in": "N[exactMean[1/10], 20]", "out": "3.98996477989391672110586579497047896201"}], "Properties & Relations": [{"in": "N[Abs[exactMean[1/20] - {flat4[1/20], curved4[1/20], curved6[1/20]}], 3]", "out": "{2.573417227488*^-7, 3.07494391784859248048960156489*^-9, 1.22795715140751951039843511*^-12}"}]}, "see": ["flat4", "curved4", "curved6", "F0"], "source": "exactMean[r0_] := NIntegrate[F0[{Sin[r0] Cos[φ], Sin[r0] Sin[φ], Cos[r0]}], {φ, 0, 2 π}, WorkingPrecision -> 40, PrecisionGoal -> 30]/(2 π);"}, "flat4": {"name": "flat4", "slug": "flat4", "guide": "means", "defined": "Notebook §4.1", "kind": "Function", "usage": [["flat4[r]", "gives the flat-space circle-mean approximation f + r²Δf/4 + r⁴Δ²f/64 at the pole, with the pole values p0, d1, d2."]], "details": ["Missing the curvature term, its error is of order r⁴."], "examples": {"Basic Examples": [{"in": "flat4[r]", "out": "4 - r^2 - (5*r^4)/16"}]}, "see": ["curved4", "curved6", "exactMean"], "source": "flat4[r_] := p0 + r^2/4 d1 + r^4 d2/64;"}, "curved4": {"name": "curved4", "slug": "curved4", "guide": "means", "defined": "Notebook §4.1", "kind": "Function", "usage": [["curved4[r]", "gives flat4[r] plus the curvature term r⁴KΔf/96 (K = 1 on the unit sphere)."]], "details": ["Its error is of order r⁶."], "examples": {"Basic Examples": [{"in": "curved4[r]", "out": "4 - r^2 - (17*r^4)/48"}]}, "see": ["flat4", "curved6"], "source": "curved4[r_] := flat4[r] + r^4 d1/96;"}, "curved6": {"name": "curved6", "slug": "curved6", "guide": "means", "defined": "Notebook §4.1", "kind": "Function", "usage": [["curved6[r]", "gives curved4[r] plus the r⁶ terms Δ³f/2304 + KΔ²f/1152 + K²Δf/1440."]], "details": ["Its error is of order r⁸. The coefficients are verified exactly against the Legendre series of P_l(cos r)."], "examples": {"Basic Examples": [{"in": "curved6[r]", "out": "4 - r^2 - (17*r^4)/48 + (63*r^6)/320"}]}, "see": ["curved4", "exactMean"], "source": "curved6[r_] := curved4[r] + r^6 (d3/2304 + d2/1152 + d1/1440);"}, "heatTrace": {"name": "heatTrace", "slug": "heatTrace", "guide": "spectral", "defined": "Notebook §5", "kind": "Function", "usage": [["heatTrace[t]", "gives the heat trace Σ (2l + 1) e^{−l(l+1)t} of the unit sphere, summed to l = 2000."]], "details": ["t must be numeric. t·heatTrace[t] → 1 + t/3 + t²/15 as t → 0 (McKean–Singer)."], "examples": {"Basic Examples": [{"in": "0.01 heatTrace[0.01]", "out": "1.003340012730275"}], "Properties & Relations": [{"in": "{0.01 heatTrace[0.01], 1 + 0.01/3 + 0.01^2/15}", "out": "{1.003340012730275, 1.0033400000000001}"}]}, "see": ["torusTrace", "ratio"], "source": "heatTrace[t_?NumericQ] := Sum[(2 j + 1) Exp[-j (j + 1) t], {j, 0, 2000}];"}, "torusTrace": {"name": "torusTrace", "slug": "torusTrace", "guide": "spectral", "defined": "Notebook §5.1", "kind": "Function", "usage": [["torusTrace[t]", "gives the heat trace of the flat square torus of side L0 = 2√π (area 4π), as θ₃(0, e^{−(2π/L0)² t})²."]], "details": ["Same area as the unit sphere, zero curvature: its ratio to Weyl’s term stays 1."], "examples": {"Basic Examples": [{"in": "0.01 torusTrace[0.01]/π", "out": "0.3183098861837906"}]}, "see": ["heatTrace", "ratio"], "source": "torusTrace[t_?NumericQ] := EllipticTheta[3, 0, Exp[-(2 π/L0)^2 t]]^2;"}, "ratio": {"name": "ratio", "slug": "ratio", "guide": "spectral", "defined": "Notebook §5.1", "kind": "Function", "usage": [["ratio[tr, t]", "gives the heat trace tr[t] divided by Weyl’s leading term Area/(4πt) for area 4π."]], "details": [], "examples": {"Basic Examples": [{"in": "{ratio[heatTrace, 0.1], ratio[torusTrace, 0.1]}", "out": "{1.034013028019415, 1.0000000000000908}"}]}, "see": ["heatTrace", "torusTrace"], "source": "ratio[tr_, t_] := tr[t]/((4 π)/(4 π t));"}, "angle": {"name": "angle", "slug": "angle", "guide": "mesh", "defined": "Notebook §7", "kind": "Function", "usage": [["angle[i, j, k]", "gives the angle at vertex i of the triangle (i, j, k) of the global vertex list P."]], "details": ["Defined for the sphere mesh of Section 7; meshCurvature has its own local version."], "examples": {"Basic Examples": [{"in": "P = {{0, 0, 0}, {1, 0, 0}, {0, 1, 0}}; angle[1, 2, 3]", "out": "Pi/2"}]}, "see": ["meshCurvature"], "source": "angle[i_, j_, k_] := VectorAngle[P[[j]] - P[[i]], P[[k]] - P[[i]]];"}, "idx": {"name": "idx", "slug": "idx", "guide": "mesh", "defined": "Notebook §7.1", "kind": "Function", "usage": [["idx[i, j]", "gives the 1-based vertex number of grid point (i, j) of the nu × nvv torus mesh, with wrap-around."]], "details": [], "examples": {"Basic Examples": [{"in": "{nu, nvv} = {40, 20}; {idx[0, 0], idx[1, 0], idx[40, 21]}", "out": "{1, 21, 2}"}]}, "see": ["meshCurvature"], "source": "idx[i_, j_] := Mod[i, nu] nvv + Mod[j, nvv] + 1;"}, "meshCurvature": {"name": "meshCurvature", "slug": "meshCurvature", "guide": "mesh", "defined": "Notebook §7.1", "kind": "Function", "usage": [["meshCurvature[P, T]", "gives an Association with the angle \"defect\", the vertex \"area\" and the cotangent Laplacian \"ΔX\" of the positions, for vertices P and triangles T."]], "details": ["defect/area approximates the Gauss curvature K; the defects of a closed mesh sum to exactly 2πχ.", "\"ΔX\" approximates −2H n (Meyer–Desbrun–Schröder–Barr)."], "examples": {"Basic Examples": [{"in": "mt = meshCurvature[PT, TT]; Chop[Total[mt[\"defect\"]], 10^-9]", "out": "0"}], "Scope": [{"in": "mt = meshCurvature[PT, TT]; Round[(mt[\"defect\"]/mt[\"area\"])[[{1, 6, 11}]], 0.001]", "out": "{0.335, 0., -0.984}"}]}, "see": ["angle", "idx", "surfaceCurvatures"], "source": "meshCurvature[P_, T_] := Module[{nv = Length[P], ang, def, Wm, Am},\n  ang[i_, j_, k_] := VectorAngle[P[[j]] - P[[i]], P[[k]] - P[[i]]];\n  def = ConstantArray[2. π, nv]; Wm = SparseArray[{}, {nv, nv}, 0.]; Am = ConstantArray[0., nv];\n  Do[Module[{a, b, c}, {a, b, c} = tri;\n    def[[a]] -= ang[a, b, c]; def[[b]] -= ang[b, c, a]; def[[c]] -= ang[c, a, b];\n    Wm[[b, c]] += Cot[ang[a, b, c]]/2; Wm[[c, b]] += Cot[ang[a, b, c]]/2;\n    Wm[[c, a]] += Cot[ang[b, c, a]]/2; Wm[[a, c]] += Cot[ang[b, c, a]]/2;\n    Wm[[a, b]] += Cot[ang[c, a, b]]/2; Wm[[b, a]] += Cot[ang[c, a, b]]/2;\n    Am[[{a, b, c}]] += Norm[Cross[P[[b]] - P[[a]], P[[c]] - P[[a]]]]/6], {tri, T}];\n  <|\"defect\" -> def, \"area\" -> Am, \"ΔX\" -> ((Wm - DiagonalMatrix[Total[Wm]]) . P)/Am|>];"}, "nbr": {"name": "nbr", "slug": "nbr", "guide": "graphs", "defined": "Notebook §8.1", "kind": "Function", "usage": [["nbr[G, v]", "gives the neighbours of vertex v in the graph G."]], "details": [], "examples": {"Basic Examples": [{"in": "nbr[CycleGraph[6], 1]", "out": "{2, 6}"}]}, "see": ["edges", "Δgraph"], "source": "nbr[G_, v_] := AdjacencyList[G, v];"}, "edges": {"name": "edges", "slug": "edges", "guide": "graphs", "defined": "Notebook §8.1", "kind": "Function", "usage": [["edges[G]", "gives the edges of G as pairs {a, b}."]], "details": [], "examples": {"Basic Examples": [{"in": "edges[CycleGraph[4]]", "out": "{{1, 2}, {1, 4}, {2, 3}, {3, 4}}"}]}, "see": ["nbr", "κLLY"], "source": "edges[G_] := List @@@ EdgeList[G];"}, "Δgraph": {"name": "Δgraph", "slug": "Deltagraph", "guide": "graphs", "defined": "Notebook §8.1", "kind": "Function", "usage": [["Δgraph[G, f][v]", "gives the random-walk Laplacian Δf(v) = mean of f over the neighbours of v − f(v)."]], "details": ["f is any function or Association of vertex values.", "This is the Laplacian used by κLLY and bakryEmery; its eigenvalues are minus those of normLap."], "examples": {"Basic Examples": [{"in": "Δgraph[CycleGraph[4], #^2 &][1]", "out": "9"}]}, "see": ["κLLY", "bakryEmery", "Δg"], "source": "Δgraph[G_, f_][v_] := Mean[f /@ nbr[G, v]] - f[v];"}, "μLazy": {"name": "μLazy", "slug": "muLazy", "guide": "graphs", "defined": "Notebook §8.1", "kind": "Function", "usage": [["μLazy[G, x, α]", "gives the lazy random-walk measure at x: mass α at x and (1 − α)/deg x on each neighbour."]], "details": [], "examples": {"Basic Examples": [{"in": "μLazy[CycleGraph[6], 1, 1/2]", "out": "<|1 -> 1/2, 2 -> 1/4, 6 -> 1/4|>"}]}, "see": ["W1", "κOllivier"], "source": "μLazy[G_, x_, α_] := Merge[{<|x -> α|>, AssociationThread[nbr[G, x] -> (1 - α)/Length[nbr[G, x]]]}, Total];"}, "W1": {"name": "W1", "slug": "W1", "guide": "graphs", "defined": "Notebook §8.1", "kind": "Function", "usage": [["W1[G, μ, ν]", "gives the Wasserstein-1 distance between the measures μ and ν (Associations vertex → mass) on G, by linear programming."]], "details": ["The ground metric is the graph distance."], "examples": {"Basic Examples": [{"in": "W1[CycleGraph[6], <|1 -> 1|>, <|4 -> 1|>]", "out": "3"}]}, "see": ["μLazy", "κOllivier"], "source": "W1[G_, μ_Association, ν_Association] := Module[{A = Keys[μ], B = Keys[ν], plan, vars},\n  vars = Flatten@Table[plan[a, b], {a, A}, {b, B}];\n  LinearOptimization[Sum[GraphDistance[G, a, b] plan[a, b], {a, A}, {b, B}],\n   Join[Table[Sum[plan[a, b], {b, B}] == μ[a], {a, A}], Table[Sum[plan[a, b], {a, A}] == ν[b], {b, B}], Thread[vars >= 0]],\n   vars, \"PrimalMinimumValue\"]];"}, "κOllivier": {"name": "κOllivier", "slug": "kappaOllivier", "guide": "graphs", "defined": "Notebook §8.1", "kind": "Function", "usage": [["κOllivier[G, {x, y}, α]", "gives Ollivier’s curvature 1 − W₁(μₓ^α, μᵧ^α)/d(x, y) with laziness α."]], "details": ["α = 0 is the non-lazy curvature κ₀; 2κ_{1/2} equals the Lin–Lu–Yau curvature on every edge."], "examples": {"Basic Examples": [{"in": "κOllivier[CompleteGraph[5], {1, 2}, 0]", "out": "3/4"}], "Properties & Relations": [{"in": "With[{G = PetersenGraph[]}, {2 κOllivier[G, {1, 3}, 1/2], κLLY[G, {1, 3}]}]", "out": "{0, 0}"}]}, "see": ["κLLY", "W1", "μLazy"], "source": "κOllivier[G_, {x_, y_}, α_] := 1 - W1[G, μLazy[G, x, α], μLazy[G, y, α]];"}, "κLLY": {"name": "κLLY", "slug": "kappaLLY", "guide": "graphs", "defined": "Notebook §8.1", "kind": "Function", "usage": [["κLLY[G, {x, y}]", "gives the Lin–Lu–Yau curvature of the edge xy by the Münch–Wojciechowski formula κ = inf {∇ₓᵧΔf : f 1-Lipschitz, f(y) − f(x) = 1}."]], "details": ["A linear program over f on the union of the two neighbourhoods, with the graph distance as Lipschitz constraint.", "κ ≥ k > 0 on every edge implies λ₁ ≥ k for the normalised Laplacian."], "examples": {"Basic Examples": [{"in": "κLLY[HypercubeGraph[3], {1, 2}]", "out": "2/3"}], "Scope": [{"in": "κLLY[KaryTree[15, 2], #] & /@ {{2, 4}, {4, 8}}", "out": "{-2/3, 2/3}"}, {"in": "dumbbell = Graph[UndirectedEdge @@@ Join[List @@@ EdgeList[CompleteGraph[5]], (List @@@ EdgeList[CompleteGraph[5]]) + 7, {{5, 6}, {6, 7}, {7, 8}}]];\nκLLY[dumbbell, {6, 7}]", "out": "0"}], "Properties & Relations": [{"in": "With[{G = CompleteGraph[5]}, {κLLY[G, {1, 2}], spec[G][[2]]}]", "out": "{5/4, 1.2499999999999998}"}]}, "see": ["κOllivier", "bakryEmery", "spec"], "source": "κLLY[G_, {x_, y_}] := Module[{S, vars, f, cons, obj},\n  S = Union[{x, y}, nbr[G, x], nbr[G, y]];\n  vars = Table[Unique[\"f\"], {Length[S]}]; f = AssociationThread[S -> vars];\n  cons = Flatten[{f[y] - f[x] == 1, f[x] == 0,\n     Table[With[{d = GraphDistance[G, S[[i]], S[[j]]]}, {f[S[[i]]] - f[S[[j]]] <= d, f[S[[j]]] - f[S[[i]]] <= d}],\n      {i, Length[S]}, {j, i + 1, Length[S]}]}];\n  obj = Δgraph[G, f][x] - Δgraph[G, f][y];\n  LinearOptimization[obj, cons, vars, \"PrimalMinimumValue\"]];"}, "bakryEmery": {"name": "bakryEmery", "slug": "bakryEmery", "guide": "graphs", "defined": "Notebook §8.2", "kind": "Function", "usage": [["bakryEmery[G, x]", "gives the Bakry–Émery curvature K∞ at vertex x: the largest K with Γ₂(f)(x) ≥ K Γ(f)(x) for all f, rounded down to 6 digits."]], "details": ["Γ and Γ₂ are built from Δgraph on the 2-ball of x; K is found by bisection on the smallest eigenvalue of Γ₂ − KΓ.", "CD(K, ∞) implies λ₁ ≥ K."], "examples": {"Basic Examples": [{"in": "bakryEmery[CompleteGraph[5], 1]", "out": "0.875"}], "Scope": [{"in": "bakryEmery[#, 1] & /@ {CycleGraph[6], HypercubeGraph[3], PetersenGraph[]}", "out": "{0., 0.666666, -0.333334}"}]}, "see": ["κLLY", "Δgraph", "spec"], "source": "bakryEmery[G_, x_] := Module[{B2, F, ff, Γv, q1, q2, M1, M2, lo = -10., hi = 10., mid},\n  B2 = VertexList[NeighborhoodGraph[G, x, 2]];\n  F = Array[𝒻, Length[B2]]; ff = AssociationThread[B2 -> F];\n  Γv[v_] := 1/2 Mean[(ff[#] - ff[v])^2 & /@ nbr[G, v]];\n  q1 = Γv[x];\n  q2 = 1/2 (Mean[Γv /@ nbr[G, x]] - Γv[x]) -\n    1/2 Mean[(ff[#] - ff[x]) (Δgraph[G, ff][#] - Δgraph[G, ff][x]) & /@ nbr[G, x]];\n  M1 = D[q1, {F, 2}]/2; M2 = D[q2, {F, 2}]/2;\n  Do[mid = (lo + hi)/2; If[Min[Eigenvalues[N[M2 - mid M1]]] >= -10^-9, lo = mid, hi = mid], {60}];\n  N[Floor[lo 10^6]/10^6]];"}, "forman": {"name": "forman", "slug": "forman", "guide": "graphs", "defined": "Notebook §8.3", "kind": "Function", "usage": [["forman[G, {x, y}]", "gives the Forman curvature 4 − deg x − deg y of the edge xy."]], "details": [], "examples": {"Basic Examples": [{"in": "forman[CompleteGraph[5], {1, 2}]", "out": "-4"}]}, "see": ["formanAug"], "source": "forman[G_, {x_, y_}] := 4 - VertexDegree[G, x] - VertexDegree[G, y];"}, "formanAug": {"name": "formanAug", "slug": "formanAug", "guide": "graphs", "defined": "Notebook §8.3", "kind": "Function", "usage": [["formanAug[G, {x, y}]", "gives the augmented Forman curvature 4 − deg x − deg y + 3·#triangles(xy)."]], "details": [], "examples": {"Basic Examples": [{"in": "formanAug[CompleteGraph[5], {1, 2}]", "out": "5"}]}, "see": ["forman"], "source": "formanAug[G_, {x_, y_}] := forman[G, {x, y}] + 3 Length[Intersection[nbr[G, x], nbr[G, y]]];"}, "resistance": {"name": "resistance", "slug": "resistance", "guide": "graphs", "defined": "Notebook §8.4", "kind": "Function", "usage": [["resistance[G]", "gives the matrix of effective resistances ωᵢⱼ = L⁺ᵢᵢ + L⁺ⱼⱼ − 2L⁺ᵢⱼ, with L the Kirchhoff matrix."]], "details": ["Foster’s theorem: the resistances of the edges sum to n − 1."], "examples": {"Basic Examples": [{"in": "Round[resistance[CycleGraph[4]], 0.001]", "out": "{{0., 0.75, 1., 0.75}, {0.75, 0., 0.75, 1.}, {1., 0.75, 0., 0.75}, {0.75, 1., 0.75, 0.}}"}], "Properties & Relations": [{"in": "With[{G = PetersenGraph[]}, Chop[Total[resistance[G][[#1, #2]] & @@@ edges[G]]]]", "out": "9.000000000000002"}]}, "see": ["pNode", "steinerberger"], "source": "resistance[G_] := Module[{Lp = PseudoInverse[N@KirchhoffMatrix[G]], n = VertexCount[G]},\n  Table[Lp[[i, i]] + Lp[[j, j]] - 2 Lp[[i, j]], {i, n}, {j, n}]];"}, "pNode": {"name": "pNode", "slug": "pNode", "guide": "graphs", "defined": "Notebook §8.4", "kind": "Function", "usage": [["pNode[G]", "gives the resistance node curvatures pᵢ = 1 − ½ Σⱼ∼ᵢ ωᵢⱼ."]], "details": ["They always sum to 1: a discrete Gauss–Bonnet theorem."], "examples": {"Basic Examples": [{"in": "Round[pNode[CycleGraph[6]], 0.001]", "out": "{0.167, 0.167, 0.167, 0.167, 0.167, 0.167}"}], "Properties & Relations": [{"in": "dumbbell = Graph[UndirectedEdge @@@ Join[List @@@ EdgeList[CompleteGraph[5]], (List @@@ EdgeList[CompleteGraph[5]]) + 7, {{5, 6}, {6, 7}, {7, 8}}]];\nChop[Total[pNode[dumbbell]]]", "out": "1.000000000000004"}]}, "see": ["resistance", "steinerberger"], "source": "pNode[G_] := With[{Ω = resistance[G], V = VertexList[G]},\n  Table[1 - 1/2 Sum[Ω[[i, VertexIndex[G, j]]], {j, nbr[G, V[[i]]]}], {i, Length[V]}]];"}, "steinerberger": {"name": "steinerberger", "slug": "steinerberger", "guide": "graphs", "defined": "Notebook §8.5", "kind": "Function", "usage": [["steinerberger[G]", "gives Steinerberger’s vertex curvatures K solving D·K = n·1, with D the distance matrix (least squares)."]], "details": ["On a tree, distance equals resistance, so steinerberger and pNode are proportional."], "examples": {"Basic Examples": [{"in": "Round[steinerberger[CompleteGraph[5]], 0.001]", "out": "{1.25, 1.25, 1.25, 1.25, 1.25}"}], "Properties & Relations": [{"in": "Correlation[steinerberger[KaryTree[15, 2]], pNode[KaryTree[15, 2]]]", "out": "1.0000000000000002"}]}, "see": ["pNode", "resistance"], "source": "steinerberger[G_] := LeastSquares[N@GraphDistanceMatrix[G], ConstantArray[N@VertexCount[G], VertexCount[G]]];"}, "higuchiVertex": {"name": "higuchiVertex", "slug": "higuchiVertex", "guide": "graphs", "defined": "Notebook §8.6", "kind": "Function", "usage": [["higuchiVertex[name]", "gives Higuchi’s combinatorial curvature 1 − d/2 + Σ 1/|face| at each vertex of the polyhedron name."]], "details": [], "examples": {"Basic Examples": [{"in": "Union[higuchiVertex[\"Dodecahedron\"]]", "out": "{1/10}"}]}, "see": ["higuchiTotal"], "source": "higuchiVertex[name_] := Module[{F = PolyhedronData[name, \"FaceIndices\"], nv = Length[PolyhedronData[name, \"VertexCoordinates\"]]},\n   Table[1 - Count[F, _?(MemberQ[#, v] &)]/2 + Total[1/Length[#] & /@ Select[F, MemberQ[#, v] &]], {v, nv}]];"}, "higuchiTotal": {"name": "higuchiTotal", "slug": "higuchiTotal", "guide": "graphs", "defined": "Notebook §8.5", "kind": "Function", "usage": [["higuchiTotal[name]", "gives the total Higuchi curvature of the polyhedron name, which is χ = 2 for convex polyhedra."]], "details": [], "examples": {"Basic Examples": [{"in": "higuchiTotal /@ {\"Tetrahedron\", \"Cube\", \"TruncatedIcosahedron\"}", "out": "{2, 2, 2}"}]}, "see": ["higuchiVertex"], "source": "higuchiTotal[name_] := Module[{F = PolyhedronData[name, \"FaceIndices\"], nv = Length[PolyhedronData[name, \"VertexCoordinates\"]]},\n  Total@Table[1 - Count[F, _?(MemberQ[#, v] &)]/2 + Total[1/Length[#] & /@ Select[F, MemberQ[#, v] &]], {v, nv}]];"}, "normLap": {"name": "normLap", "slug": "normLap", "guide": "graphs", "defined": "Notebook §9", "kind": "Function", "usage": [["normLap[G]", "gives the normalised Laplacian I − D^{−1/2} A D^{−1/2} of G as a numerical matrix."]], "details": ["Its eigenvalues lie in [0, 2]."], "examples": {"Basic Examples": [{"in": "normLap[CycleGraph[3]]", "out": "{{1., -0.4999999999999999, -0.4999999999999999}, {-0.4999999999999999, 1., -0.4999999999999999}, {-0.4999999999999999, -0.4999999999999999, 1.}}"}]}, "see": ["spec"], "source": "normLap[G_] := Module[{A = N@AdjacencyMatrix[G], d}, d = Total[A];\n   IdentityMatrix[Length[d]] - DiagonalMatrix[d^(-1/2)] . A . DiagonalMatrix[d^(-1/2)]];"}, "spec": {"name": "spec", "slug": "spec", "guide": "graphs", "defined": "Notebook §9", "kind": "Function", "usage": [["spec[G]", "gives the sorted eigenvalues of normLap[G]."]], "details": ["spec[G][[2]] is λ₁, the spectral gap compared with κLLY and bakryEmery."], "examples": {"Basic Examples": [{"in": "Chop[spec[CycleGraph[6]]]", "out": "{0, 0.4999999999999999, 0.5, 1.4999999999999996, 1.4999999999999996, 2.0000000000000004}"}]}, "see": ["normLap", "κLLY", "bakryEmery"], "source": "spec[G_] := Sort[Eigenvalues[normLap[G]]];"}, "Lpc": {"name": "Lpc", "slug": "Lpc", "guide": "graphs", "defined": "Notebook §9", "kind": "Function", "usage": [["Lpc[p]", "gives the heat-kernel point-cloud Laplacian of f = z at the point p: (weighted mean of z − z(p))/tPC over the global point set pts, with Gaussian weights of width tPC."]], "details": ["Belkin–Niyogi: as the points fill the manifold and t → 0 this converges to Δz = −2z on S²."], "examples": {"Basic Examples": [{"in": "Lpc[{0, 0, 1.}]", "out": "-2.04782576126461"}]}, "see": ["spec"], "source": "Lpc[p_] := Module[{q = nf[p, {All, 6 Sqrt[tPC]}], w}, w = Exp[-SquaredEuclideanDistance[p, #]/(4 tPC)] & /@ q;\n   (w . q[[All, 3]]/Total[w] - p[[3]])/tPC];"}, "edgeCurvaturePlot": {"name": "edgeCurvaturePlot", "slug": "edgeCurvaturePlot", "guide": "graphviz", "defined": "Notebook §8.6", "kind": "Function", "usage": [["edgeCurvaturePlot[G, κf, s, label]", "draws G with each edge coloured by κf[G, edge] on the κColour scale ±s."]], "details": [], "examples": {"Basic Examples": [{"in": "dumbbell = Graph[UndirectedEdge @@@ Join[List @@@ EdgeList[CompleteGraph[5]], (List @@@ EdgeList[CompleteGraph[5]]) + 7, {{5, 6}, {6, 7}, {7, 8}}]];\nedgeCurvaturePlot[dumbbell, κLLY, 1.25, \"Dumbbell: κ_LLY\"]", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAApCAIAAAATV5T4AAAAxmVYSWZJSSoACAAAAAgAAAEEAAEAAAC0AAAAAQEEAAEAAAApAAAAGgEFAAEAAABuAAAAGwEFAAEAAAB2AAAAKAEDAAEAAAACAAAAMQECADMAAAB+AAAAMgECABMAAACyAAAAKogIAAEAAAD6/wAAAAAAAEgAAAABAAAASAAAAAEAAABDcmVhdGVkIHdpdGggdGhlIFdvbGZyYW0gTGFuZ3VhZ2UgOiB3d3cud29sZnJhbS5jb20AMjAyNjoxMToyMyAwNzo0NzoyOAC9yGyEAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAPHRFWHRTb2Z0d2FyZQBDcmVhdGVkIHdpdGggdGhlIFdvbGZyYW0gTGFuZ3VhZ2UgOiB3d3cud29sZnJhbS5jb21coqaFAAAAIXRFWHRDcmVhdGlvbiBUaW1lADIwMjY6MTE6MjMgMDc6NDc6MjhUUTMXAAAPHElEQVR4Xu1cCXhTVb6/594kTbokbdONkm6UQgcKWp76sOBThyfOOCAoLdsMKKIsggP6HjgqAqPzqQwPAS3I8oowKOVjG0UBRXG+mWEbCwIFWiotLU2aAl2SdEnTNLnn/U5vSQOt0mTGEl5zer98uTdnu///7/y38z8lVKScv/gp0BkFeB8ky9wX5maNz5o0eRKu995/r7Gx0YtJ1tbWTn92+k0Np0yd0tDQ8OO9HT58+N2V76JO9prsb775xouh0QSvUFBQ4Gp78uTJBQsXuG5zc3NXvLtCuq2rq5s4aWJVVZV3A/2krXwRHHjh3y/9fe623E05m2w22+uLX/9JSdD9nY8fPx7QkdCz8X83PjH2icjIyO6fxi1H9FFwSPNWqVTz582/dOlSWVnZ3r17N2/ZLD3HKiwuLsYXSIKcTTkzZ818bsZzFy9exPPJv56MdSlVczqdb7391oyZM15b9FpTU5P08ONtH8+ZOwdNysvLcVtfX//Gm2/gFtWwvjulV3Nzc0tLyy1J2fUKgiC8OP/FlatWnj9/vrCwMDMzs+ttu7OmT4MDhFAoFImJiRIjOy3hYeHr160fNmwYeLz49cUQNrv37Lbb7agMSI0dM3bD+g06nW7Hjh1S85DgkDXZa6Y9PQ28we36DetH/HwEelj+x+Wr31stimLHUdatX7dnzx7359ACL/z2BYBm+f8s37p1K6Ue221paWkpKSkLX14I9AMr3cnyro/l6+DAm/w46R966CHUSembkpqaGhISolQqo6OjYXDgYa9evQYMGIAvIx8ZmX82XyLKiBEj8Dl06FBAB1DIy8vbsXPHvPnzFi9ZjIEsFktH2o17ctzDDz/s/hwrXq1WL1m65NGRj06ZMoU ug": "totalK", "guide": "flows", "defined": "Notebook §10.2", "kind": "Function", "usage": [["totalK[t]", "gives ∬K dA = −∬Δ₀w dx dy at time t; it stays 0 (Gauss–Bonnet, χ = 0)."]], "details": [], "examples": {"Basic Examples": [{"in": "Chop[totalK /@ {0, 1, 2}, 10^-4]", "out": "{0, 0, 0}"}]}, "see": ["Kt", "maxK"], "source": "totalK[tt_] := Total[Flatten@Table[-(Derivative[0, 2, 0][w][tt, x, y] + Derivative[0, 0, 2][w][tt, x, y]) /. solR,\n     {x, 0, 2 π - π/20, π/20}, {y, 0, 2 π - π/20, π/20}]] (π/20)^2;"}, "lapCurve": {"name": "lapCurve", "slug": "lapCurve", "guide": "flows", "defined": "Notebook §10.3", "kind": "Function", "usage": [["lapCurve[X]", "gives ∂²X/∂s² of the closed polygon X: the arc-length-weighted Laplacian of the cycle graph on its vertices."]], "details": ["One Euler step X + dt lapCurve[X] is curve-shortening flow; on a circle it points inwards with length 1/r."], "examples": {"Basic Examples": [{"in": "With[{X = Table[{Cos[s], Sin[s]}, {s, 0., 2 π - π/50, π/50}]}, Norm[lapCurve[X][[1]]]]", "out": "1.0000000000000033"}]}, "see": ["polyArea", "resample"], "source": "lapCurve[X_] := Module[{fw = RotateLeft[X] - X, bw = X - RotateRight[X], lf, lb}, lf = Norm /@ fw; lb = Norm /@ bw; 2 (fw/lf - bw/lb)/(lf + lb)];"}, "polyArea": {"name": "polyArea", "slug": "polyArea", "guide": "flows", "defined": "Notebook §10.3", "kind": "Function", "usage": [["polyArea[X]", "gives the area enclosed by the closed polygon X (shoelace formula)."]], "details": [], "examples": {"Basic Examples": [{"in": "polyArea[{{0, 0}, {1, 0}, {1, 1}, {0, 1}}]", "out": "1"}]}, "see": ["lapCurve", "resample"], "source": "polyArea[X_] := 1/2 Abs[Total[MapThread[#1[[1]] #2[[2]] - #2[[1]] #1[[2]] &, {X, RotateLeft[X]}]]];"}, "resample": {"name": "resample", "slug": "resample", "guide": "flows", "defined": "Notebook §10.3", "kind": "Function", "usage": [["resample[X]", "redistributes the nC vertices of the closed polygon X evenly by arc length."]], "details": [], "examples": {"Basic Examples": [{"in": "nC = 4; resample[{{0, 0}, {2, 0}, {2, 2}, {0, 2}}]", "out": "{{0, 0}, {2, 0}, {2, 2}, {0, 2}}"}]}, "see": ["lapCurve", "polyArea"], "source": "resample[X_] := Module[{c = Append[X, First[X]], s, f}, s = Prepend[Accumulate[Norm /@ Differences[c]], 0];\n   f = Interpolation[Transpose[{s, c}], InterpolationOrder -> 1]; Table[f[q], {q, 0, Last[s] - Last[s]/nC, Last[s]/nC}]];"}, "κS2": {"name": "κS2", "slug": "kappaS2", "guide": "flows", "defined": "Notebook §10.4", "kind": "Function", "usage": [["κS2[ε]", "gives the Ollivier curvature of ε-balls on the unit sphere, in the limit δ → 0, from the sliding (rotation) coupling."]], "details": ["κS2[ε]/ε² → 1/8 = Ric/(2(n + 2)) as ε → 0. The integrand is written as s²/(1 + √(1 − s²)) to avoid cancellation."], "examples": {"Basic Examples": [{"in": "κS2[0.05]/0.05^2", "out": "0.12496093497886211"}]}, "see": ["κH2", "κLLY"], "source": "κS2[ε_?NumericQ] := NIntegrate[With[{s = Sin[ρ] Sin[α]}, s^2/(1 + Sqrt[1 - s^2])] Sin[ρ], {ρ, 0, ε}, {α, 0, 2 π}]/(2 π (1 - Cos[ε]));"}, "κH2": {"name": "κH2", "slug": "kappaH2", "guide": "flows", "defined": "Notebook §10.4", "kind": "Function", "usage": [["κH2[ε]", "gives the Ollivier curvature of ε-balls on the hyperbolic plane (K = −1), in the limit δ → 0."]], "details": ["κH2[ε]/ε² → −1/8 as ε → 0."], "examples": {"Basic Examples": [{"in": "κH2[0.05]/0.05^2", "out": "-0.1250390675911518"}]}, "see": ["κS2"], "source": "κH2[ε_?NumericQ] := -NIntegrate[With[{s = Sinh[ρ] Sin[α]}, s^2/(1 + Sqrt[1 + s^2])] Sinh[ρ], {ρ, 0, ε}, {α, 0, 2 π}]/(2 π (Cosh[ε] - 1));"}, "Lap": {"name": "Lap", "slug": "Lap", "guide": "snippets", "defined": "Lab Wolfram cells: Bochner and Weitzenböck snippets", "kind": "Snippet function", "usage": [["Lap[w]", "gives the Laplace–Beltrami operator of w(θ, φ) on the unit sphere, using the snippet globals g, gi and X."]], "details": ["Twin of laplaceBeltrami[gS2, 𝓍S2]. The Weitzenböck snippet defines it directly as (1/sin θ)(∂θ(sin θ ∂θw) + ∂φ²w/sin θ)."], "examples": {"Basic Examples": [{"in": "Simplify[Lap[Cos[θ]]]", "out": "-2*Cos[θ]"}]}, "see": ["laplaceBeltrami"], "source": "Lap[w_] := 1/Sqrt[Det[g]] Sum[D[Sqrt[Det[g]] gi[[i, j]] D[w, X[[j]]], X[[i]]], {i, 2}, {j, 2}];\n(* Weitzenböck snippet form: *)\nLap[w_] := 1/Sin[θ] (D[Sin[θ] D[w, θ], θ] + D[w, φ, φ]/Sin[θ]);"}, "g2": {"name": "g2", "slug": "g2", "guide": "snippets", "defined": "Lab Wolfram cell: Bochner snippet", "kind": "Snippet function", "usage": [["g2[w]", "gives |∇w|² on the unit sphere."]], "details": ["Twin of gradNorm2[gS2, 𝓍S2]."], "examples": {"Basic Examples": [{"in": "g2[Sin[θ] Cos[φ]]", "out": "Cos[θ]^2*Cos[φ]^2 + Sin[φ]^2"}]}, "see": ["gradNorm2"], "source": "g2[w_] := Sum[gi[[i, j]] D[w, X[[i]]] D[w, X[[j]]], {i, 2}, {j, 2}];"}, "Hs": {"name": "Hs", "slug": "Hs", "guide": "snippets", "defined": "Lab Wolfram cell: Bochner snippet", "kind": "Snippet function", "usage": [["Hs[w]", "gives the covariant Hessian of w on the unit sphere."]], "details": ["Twin of hessian[gS2, 𝓍S2]."], "examples": {"Basic Examples": [{"in": "Simplify[Hs[Cos[θ]]]", "out": "{{-Cos[θ], 0}, {0, -(Cos[θ]*Sin[θ]^2)}}"}]}, "see": ["hessian"], "source": "Hs[w_] := Table[D[w, X[[i]], X[[j]]] - Sum[Γ[[k, i, j]] D[w, X[[k]]], {k, 2}], {i, 2}, {j, 2}];"}, "rough": {"name": "rough", "slug": "rough", "guide": "snippets", "defined": "Lab Wolfram cell: Weitzenböck snippet", "kind": "Snippet function", "usage": [["rough[ω]", "gives the rough Laplacian ∇*∇ω of a 1-form on the unit sphere."]], "details": ["Twin of roughLaplacian1[gS2, 𝓍S2]."], "examples": {"Basic Examples": [{"in": "Simplify[rough[{0, Sin[θ]^2}]]", "out": "{0, Sin[θ]^2}"}]}, "see": ["roughLaplacian1"], "source": "rough[ω_] := Module[{T, TT}, T = Table[D[ω[[i]], X[[j]]] - Sum[Γ[[k, i, j]] ω[[k]], {k, 2}], {i, 2}, {j, 2}];\n  TT = Table[D[T[[i, j]], X[[k]]] - Sum[Γ[[m, k, i]] T[[m, j]] + Γ[[m, k, j]] T[[i, m]], {m, 2}], {i, 2}, {j, 2}, {k, 2}];\n  Table[-Sum[gi[[j, k]] TT[[i, j, k]], {j, 2}, {k, 2}], {i, 2}]];"}, "star": {"name": "star", "slug": "star", "guide": "snippets", "defined": "Lab Wolfram cell: Weitzenböck snippet", "kind": "Snippet function", "usage": [["star[{a, b}]", "gives the Hodge star {−b/sin θ, a sin θ} of a 1-form on the unit sphere."]], "details": ["Twin of star1."], "examples": {"Basic Examples": [{"in": "star[{1, 0}]", "out": "{0, Sin[θ]}"}]}, "see": ["star1"], "source": "star[{a_, b_}] := {-b/Sin[θ], a Sin[θ]};"}, "Δg": {"name": "Δg", "slug": "Deltag", "guide": "snippets", "defined": "Lab Wolfram cell: Lin–Lu–Yau snippet", "kind": "Snippet function", "usage": [["Δg[G, f][v]", "gives the random-walk Laplacian of f at v."]], "details": ["Twin of Δgraph."], "examples": {"Basic Examples": [{"in": "Δg[CycleGraph[4], #^2 &][1]", "out": "9"}]}, "see": ["Δgraph", "κLLY"], "source": "Δg[G_, f_][v_] := Mean[f /@ nbr[G, v]] - f[v];"}}, "brand": "CCN"}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    out += esc(code.slice(i, m.index)); const t = m[0]; i = m.index + t.length;
    if (t.startsWith('(*')) out += '<span class="cmt">' + esc(t) + '</span>';
    else if (t[0] === '"') out += '<span class="str">' + esc(t) + '</span>';
    else if (/^\d/.test(t)) out += '<span class="num">' + esc(t) + '</span>';
    else if (P[t] && t !== self && !/^[\p{L}\p{N}$]/u.test(code[m.index - 1] || ' ')) out += '<a class="fn" href="#/ref/' + P[t].slug + '">' + esc(t) + '</a>';
    else if (P[t]) out += '<span class="fn">' + esc(t) + '</span>';
    else out += esc(t);
  }
  return out + esc(code.slice(i));
}
function tpl(t) {
  // name[args] -> bold name, italic argument identifiers
  const m = t.match(/^([^\[]+)(\[[\s\S]*)?$/u);
  if (!m) return esc(t);
  let rest = m[2] || '';
  rest = esc(rest).replace(/(^|[\[\s,{(+−*/^=&;])([\p{L}][\p{L}\p{N}]*)/gu, (a, p, id) => P[id] ? p + '<a href="#/ref/' + P[id].slug + '"><b>' + id + '</b></a>' : (/^(Graph|True|False|All|None|Automatic)$/.test(id) ? p + id : p + '<i>' + id + '</i>'));
  return '<b>' + esc(m[1]) + '</b>' + rest;
}
function inline(s) {
  return esc(s).replace(/(^|[\s(“"])([\p{L}][\p{L}\p{N}]*)(?=[\s,.;:)”"]|$)/gu, (a, p, id) => P[id] ? p + '<a class="mono" href="#/ref/' + P[id].slug + '">' + id + '</a>' : a);
}
function copyBtn() { return '<button class="copy" onclick="cp(this)">Copy</button>'; }
window.cp = b => { const t = b.parentNode.getAttribute('data-raw'); navigator.clipboard && navigator.clipboard.writeText(t); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200); };
function crumbs(parts) {
  document.getElementById('crumbs').innerHTML = '<a href="#/">' + esc(D.title) + '</a>' + parts.map(p => '<span class="sep">›</span>' + (p[1] ? '<a href="' + p[1] + '">' + esc(p[0]) + '</a>' : '<span>' + esc(p[0]) + '</span>')).join('') +
    '<span class="right"><a href="#/index">Function index</a><a href="' + D.lab + '" target="_blank" rel="noopener">' + esc(D.labname) + ' ↗</a></span>';
}
const foot = () => '<footer><span>© Computational Classnotes · CC BY-NC-SA 4.0</span><span>' + esc(D.title) + ' · Programmer’s Manual 1.0 · <a href="' + D.repo + '" target="_blank" rel="noopener">source</a></span></footer>';
function home() {
  crumbs([]);
  let n = NAMES.length, ex = 0; NAMES.forEach(k => Object.values(P[k].examples).forEach(l => ex += l.length));
  let h = '<section class="hero"><h1>' + esc(D.title) + ' · Programmer’s Manual</h1><p>' + esc(D.subtitle) + '</p>' + (D.intro ? '<p style="margin-top:10px">' + esc(D.intro) + '</p>' : '') +
    '<div class="meta">Every function defined in the code base has its own reference page. All examples were evaluated on a Wolfram Language kernel. · <a href="' + D.lab + '" target="_blank" rel="noopener">Open the Lab</a> · <a href="' + D.repo + '" target="_blank" rel="noopener">GitHub</a></div></section>';
  h += '<div class="stats"><div><b>' + n + '</b>reference pages</div><div><b>' + D.guides.length + '</b>guides</div><div><b>' + ex + '</b>verified examples</div></div>';
  h += '<div class="tiles">' + D.guides.map(g => '<a class="tile" href="#/guide/' + g.id + '"><h3>' + esc(g.title) + '</h3><p>' + esc(g.desc) + '</p><div class="fns">' + g.fns.slice(0, 8).map(esc).join(' · ') + (g.fns.length > 8 ? ' · …' : '') + '</div></a>').join('') + '</div>';
  return h + foot();
}
function guide(id) {
  const g = G[id]; if (!g) return notFound();
  crumbs([['Guides', '#/'], [g.title]]);
  let h = '<div class="reftype"><span class="tag val">Guide</span></div><div class="gtitle">' + esc(g.title) + '</div><p class="gdesc">' + inline(g.desc) + '</p><div class="glist">';
  h += g.fns.map(f => '<div class="r"><a href="#/ref/' + P[f].slug + '">' + esc(f) + '</a><span>' + inline(P[f].usage[0][1]) + '</span></div>').join('');
  h += '</div><h3 style="margin:28px 0 8px;font-size:17px">Related Guides</h3><div class="see">' + D.guides.filter(x => x.id !== id).map(x => '<a href="#/guide/' + x.id + '" style="font-family:inherit">' + esc(x.title) + '</a>').join('') + '</div>';
  return h + foot();
}
function ref(name) {
  const p = P[name]; if (!p) return notFound();
  const g = G[p.guide];
  crumbs([[g.title, '#/guide/' + g.id], [name]]);
  const tagc = p.kind.startsWith('Snippet') ? 'snip' : p.kind.startsWith('API') ? 'api' : p.kind.startsWith('Symbol') || p.kind.startsWith('Value') ? 'val' : '';
  let h = '<div class="reftype"><span class="tag ' + tagc + '">' + esc(p.kind) + '</span><span style="font-size:13px;color:var(--muted)">Defined in ' + esc(p.defined) + '</span></div>';
  h += '<h1 class="sym">' + esc(name) + '</h1><div class="usage">' + p.usage.map(u => '<div class="row"><div class="tpl">' + tpl(u[0]) + '</div><div class="txt">' + inline(u[1]) + '</div></div>').join('') + '</div>';
  if (p.details.length) h += '<details class="sec"><summary>Details and Options</summary><ul class="detail-list">' + p.details.map(d => '<li>' + inline(d) + '</li>').join('') + '</ul></details>';
  let total = 0; Object.values(p.examples).forEach(l => total += l.length);
  h += '<details class="sec" open><summary>Examples <span class="n">(' + total + ')</span></summary>';
  let n = 0, first = true;
  for (const [sec, rows] of Object.entries(p.examples)) {
    h += '<details class="sub"' + (first ? ' open' : '') + '><summary>' + esc(sec) + ' <span class="n">(' + rows.length + ')</span></summary>'; first = false;
    for (const r of rows) {
      n++;
      h += '<div class="cell"><div class="lab">In[' + n + ']:=</div><pre class="in" data-raw="' + esc(r.in) + '">' + hl(r.in, name) + copyBtn() + '</pre></div>';
      if (r.img) h += '<div class="cell"><div class="lab o">Out[' + n + ']=</div><div class="img"><img alt="Output of example ' + n + '" src="' + r.img + '"></div></div>';
      else h += '<div class="cell"><div class="lab o">Out[' + n + ']=</div><pre class="out" data-raw="' + esc(r.out) + '">' + hl(r.out, name) + copyBtn() + '</pre></div>';
    }
    h += '</details>';
  }
  h += '</details>';
  if (p.source) h += '<details class="sec src"><summary>Definition</summary><p class="note">CCN source, as defined in ' + esc(p.defined) + '.</p><pre>' + hl(p.source, name) + '</pre></details>';
  if (p.see.length) h += '<details class="sec" open><summary>See Also</summary><div class="see">' + p.see.map(s => '<a href="#/ref/' + P[s].slug + '">' + esc(s) + '</a>').join('<span style="color:#bbb">·</span>') + '</div></details>';
  h += '<details class="sec" open><summary>Related Guides</summary><div class="guides">▪ <a href="#/guide/' + g.id + '">' + esc(g.title) + '</a></div></details>';
  h += '<details class="sec" open><summary>History</summary><div class="hist">Introduced in 2026 (1.0)</div></details>';
  return h + foot();
}
function index() {
  crumbs([['Function index']]);
  const groups = {};
  NAMES.slice().sort((a, b) => a.localeCompare(b, 'en', {sensitivity: 'base'})).forEach(n => { let c = n.normalize('NFKD')[0].toUpperCase(); if (!/[A-Z]/.test(c)) c = 'Symbols'; (groups[c] = groups[c] || []).push(n); });
  let h = '<div class="gtitle">Function index</div><p class="gdesc">All ' + NAMES.length + ' reference pages, alphabetically.</p><div class="idx">';
  Object.keys(groups).sort((a, b) => a === 'Symbols' ? 1 : b === 'Symbols' ? -1 : a.localeCompare(b)).forEach(c => h += '<h2>' + c + '</h2><div class="cols">' + groups[c].map(n => '<a href="#/ref/' + P[n].slug + '">' + esc(n) + '<small>' + esc(G[P[n].guide].title) + '</small></a>').join('') + '</div>');
  return h + '</div>' + foot();
}
function notFound() { crumbs([['Not found']]); return '<p>Page not found. <a href="#/">Home</a></p>' + foot(); }
function route() {
  const h = location.hash.replace(/^#\/?/, ''); let html;
  if (!h) html = home();
  else if (h.startsWith('ref/')) html = ref(bySlug[h.slice(4)]);
  else if (h.startsWith('guide/')) html = guide(h.slice(6));
  else if (h === 'index') html = index();
  else html = notFound();
  document.getElementById('main').innerHTML = html; window.scrollTo(0, 0);
  const t = h.startsWith('ref/') && bySlug[h.slice(4)];
  document.title = (t ? t + ' — ' : '') + D.title + ' Programmer’s Manual';
}
window.addEventListener('hashchange', route); route();
// search
const q = document.getElementById('q'), R = document.getElementById('results'); let sel = 0, hits = [];
function search() {
  const s = q.value.trim().toLowerCase(); if (!s) { R.style.display = 'none'; return; }
  hits = NAMES.map(n => { const ln = n.toLowerCase(), sl = P[n].slug.toLowerCase(); let sc = ln === s || sl === s ? 0 : ln.startsWith(s) || sl.startsWith(s) ? 1 : ln.includes(s) || sl.includes(s) ? 2 : (P[n].usage.map(u => u[1]).join(' ') + ' ' + P[n].details.join(' ')).toLowerCase().includes(s) ? 3 : 9; return [sc, n]; })
    .filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || a[1].length - b[1].length).slice(0, 14).map(x => x[1]);
  sel = 0;
  R.innerHTML = hits.length ? hits.map((n, i) => '<a href="#/ref/' + P[n].slug + '" class="' + (i === sel ? 'on' : '') + '"><b>' + esc(n) + '</b><span>' + esc(P[n].usage[0][1]) + '</span></a>').join('') : '<a><span>No matches</span></a>';
  R.style.display = 'block';
}
q.addEventListener('input', search);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; [...R.children].forEach((a, i) => a.classList.toggle('on', i === sel)); }
  if (e.key === 'Enter' && hits[sel]) { location.hash = '#/ref/' + P[hits[sel]].slug; R.style.display = 'none'; q.blur(); }
  if (e.key === 'Escape') { R.style.display = 'none'; q.blur(); }
});
R.addEventListener('click', () => { R.style.display = 'none'; q.value = ''; });
document.addEventListener('click', e => { if (!e.target.closest('.search')) R.style.display = 'none'; });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } });
</script>
